<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kompas Kiblat — Tanaman Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope', sans-serif; color: #eaf3ec; padding: 24px 16px 40px; background: linear-gradient(180deg, #16283b 0%, #0a1220 60%, #0d1a15 100%); min-height: 100vh; text-align: center; }
  .serif { font-family: 'Lora', serif; }
  .wrap { max-width: 400px; margin: 0 auto; }
  .back-link { color: #9fb3a8; text-decoration: none; font-size: 13px; display: block; text-align: left; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 24px; }

  .compass-outer { position: relative; width: 240px; height: 240px; margin: 0 auto 24px; }
  .compass-rose {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
    border: 2px solid rgba(255,255,255,0.15); transition: transform 0.2s ease;
  }
  .compass-rose::before, .compass-rose::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.2);
  }
  .compass-rose::before { width: 1px; height: 100%; left: 50%; }
  .compass-rose::after { height: 1px; width: 100%; top: 50%; }
  .dir-label { position: absolute; font-size: 12px; color: #9fb3a8; font-weight: 700; }
  .dir-n { top: 8px; left: 50%; transform: translateX(-50%); color: #4ade80; }
  .dir-s { bottom: 8px; left: 50%; transform: translateX(-50%); }
  .dir-e { right: 8px; top: 50%; transform: translateY(-50%); }
  .dir-w { left: 8px; top: 50%; transform: translateY(-50%); }

  .needle {
    position: absolute; top: 50%; left: 50%; width: 4px; height: 90px;
    background: linear-gradient(180deg, #4ade80, #1a5c33);
    transform-origin: bottom center; margin-left: -2px; margin-top: -90px;
    border-radius: 4px; transition: transform 0.3s ease;
  }
  .needle::before {
    content: '🕋'; position: absolute; top: -18px; left: -10px; font-size: 20px;
  }
  .kaaba-dot { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: #4ade80; border-radius: 50%; transform: translate(-50%,-50%); }

  .info-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .info-card { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px; }
  .info-card .label { font-size: 10.5px; color: #9fb3a8; text-transform: uppercase; letter-spacing: .06em; }
  .info-card .value { font-size: 20px; font-family: 'Lora', serif; margin-top: 4px; }

  .sensor-btn { background: #1a3320; color: #4ade80; border: none; padding: 12px 20px; border-radius: 10px; font-weight: 700; font-size: 13px; cursor: pointer; margin-bottom: 10px; }
  .sensor-status { font-size: 11.5px; color: #9fb3a8; }
</style>
</head>
<body>
<div class="wrap">
  <a href="akun.html" class="back-link">← Kembali</a>
  <h1 class="serif">Kompas Kiblat</h1>

  <div class="compass-outer">
    <div class="compass-rose" id="compassRose">
      <span class="dir-label dir-n">U</span>
      <span class="dir-label dir-s">S</span>
      <span class="dir-label dir-e">T</span>
      <span class="dir-label dir-w">B</span>
    </div>
    <div class="needle" id="needle"></div>
    <div class="kaaba-dot"></div>
  </div>

  <div class="info-row">
    <div class="info-card"><div class="label">Arah dari Utara</div><div class="value" id="derajatVal">-</div></div>
    <div class="info-card"><div class="label">Jarak ke Ka'bah</div><div class="value" id="jarakVal">-</div></div>
  </div>

  <p id="kiblatInfo" style="font-size:12px; color:#9fb3a8; margin-bottom:14px;"></p>
  <button class="sensor-btn" onclick="deteksiLokasi()" style="background:#1a3320; margin-bottom:10px;">📍 Deteksi Lokasi Saya</button>
  <button class="sensor-btn" onclick="aktifkanSensor()">Aktifkan Sensor Kompas</button>
  <p class="sensor-status" id="sensorStatus">Sensor belum aktif — tekan tombol di atas (perlu perangkat mobile).</p>
</div>
<script src="js/api.js"></script>
<script src="js/kiblat.js"></script>
</body>
</html>
