<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profil — Tanaman Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope', sans-serif; color: #eaf3ec; padding: 24px 16px 40px; background: linear-gradient(180deg, #16283b 0%, #0a1220 60%, #0d1a15 100%); min-height: 100vh; }
  .serif { font-family: 'Lora', serif; }
  .wrap { max-width: 460px; margin: 0 auto; }
  .back-link { color: #9fb3a8; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 20px; }

  .field-group { margin-bottom: 16px; }
  .field-group label { display: block; font-size: 12.5px; font-weight: 600; color: #cfe0da; margin-bottom: 6px; }
  .field-group input[type="text"], .field-group select {
    width: 100%; padding: 12px 14px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px;
    background: rgba(255,255,255,0.04); color: #eaf3ec; font-family: 'Manrope', sans-serif; font-size: 14px;
  }
  .field-group input[type="file"] { color: #9fb3a8; font-size: 12.5px; }
  .radio-row { display: flex; gap: 10px; }
  .radio-option { flex: 1; display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px solid rgba(255,255,255,0.12); border-radius: 10px; font-size: 13.5px; }

  .btn-primary { width: 100%; padding: 14px; background: #1a3320; color: #4ade80; border: none; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 8px; }
  .msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; display: none; }
  .msg.show { display: block; }
  #errorBox { background: rgba(224,92,92,0.15); color: #f5a3a3; }
  #successBox { background: rgba(74,222,128,0.15); color: #4ade80; }
</style>
</head>
<body>
<div class="wrap">
  <a href="akun.html" class="back-link">← Kembali</a>
  <h1 class="serif">Edit Profil</h1>

  <div class="msg" id="errorBox"></div>
  <div class="msg" id="successBox"></div>

  <div style="text-align:center; margin-bottom:20px;">
  <img id="fotoPreview" src="" style="display:none; width:96px; height:96px; border-radius:50%; object-fit:cover; border:2px solid rgba(74,222,128,0.4);">
  <div id="fotoPlaceholder" style="width:96px; height:96px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; font-size:32px; margin:0 auto;">👤</div>
  </div>

  <form onsubmit="handleUpdateProfile(event)">
    <div class="field-group">
      <label for="display_name">Nama Tampilan</label>
      <input type="text" id="display_name" placeholder="Nama kamu">
    </div>
    <div class="field-group">
      <label>Jenis Kelamin</label>
      <div class="radio-row">
        <label class="radio-option"><input type="radio" name="gender" value="male"> Laki-laki</label>
        <label class="radio-option"><input type="radio" name="gender" value="female"> Perempuan</label>
      </div>
    </div>
    <div class="field-group">
      <label for="provinsi">Provinsi</label>
      <select id="provinsi">
        <option value="aceh">Aceh</option><option value="sumut">Sumatera Utara</option>
        <option value="sumbar">Sumatera Barat</option><option value="riau">Riau</option>
        <option value="kepri">Kepulauan Riau</option><option value="jambi">Jambi</option>
        <option value="sumsel">Sumatera Selatan</option><option value="bengkulu">Bengkulu</option>
        <option value="lampung">Lampung</option><option value="babel">Kepulauan Bangka Belitung</option>
        <option value="dki">DKI Jakarta</option><option value="jabar">Jawa Barat</option>
        <option value="jateng">Jawa Tengah</option><option value="diy">DI Yogyakarta</option>
        <option value="jatim">Jawa Timur</option><option value="banten">Banten</option>
        <option value="bali">Bali</option><option value="ntb">Nusa Tenggara Barat</option>
        <option value="ntt">Nusa Tenggara Timur</option><option value="kalbar">Kalimantan Barat</option>
        <option value="kalteng">Kalimantan Tengah</option><option value="kalsel">Kalimantan Selatan</option>
        <option value="kaltim">Kalimantan Timur</option><option value="kaltara">Kalimantan Utara</option>
        <option value="sulut">Sulawesi Utara</option><option value="sulteng">Sulawesi Tengah</option>
        <option value="sulsel">Sulawesi Selatan</option><option value="sultra">Sulawesi Tenggara</option>
        <option value="gorontalo">Gorontalo</option><option value="sulbar">Sulawesi Barat</option>
        <option value="maluku">Maluku</option><option value="malut">Maluku Utara</option>
        <option value="papua">Papua</option><option value="papbar">Papua Barat</option>
        <option value="papsel">Papua Selatan</option><option value="paptgh">Papua Tengah</option>
        <option value="pappeg">Papua Pegunungan</option><option value="papbrd">Papua Barat Daya</option>
      </select>
    </div>
    <div class="field-group">
      <label for="foto_profil">Foto Profil</label>
      <input type="file" id="foto_profil" accept="image/*">
    </div>
    <button type="submit" class="btn-primary" id="submitBtn">Simpan Perubahan</button>
  </form>
</div>
<script src="js/api.js"></script>
<script src="js/profil.js"></script>
</body>
</html>
