<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifikasi — Tanaman Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Manrope', sans-serif; color: #eaf3ec; padding: 24px 16px 40px; background: linear-gradient(180deg, #16283b 0%, #0a1220 60%, #0d1a15 100%); min-height: 100vh; }
  .serif { font-family: 'Lora', serif; }
  .wrap { max-width: 460px; margin: 0 auto; }
  .back-link { color: #9fb3a8; text-decoration: none; font-size: 13px; display: inline-block; margin-bottom: 16px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .desc { font-size: 12.5px; color: #9fb3a8; margin-bottom: 18px; }

  .perm-box { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .perm-box span { font-size: 12.5px; color: #cfe0da; }
  .perm-actions { display: flex; gap: 6px; }
  .perm-btn { background: #1a3320; color: #4ade80; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

  .toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
  }
  .toggle-row .label { display: flex; flex-direction: column; }
  .toggle-row .name { font-size: 14px; font-weight: 700; }
  .toggle-row .time { font-size: 11.5px; color: #9fb3a8; }

  .switch { position: relative; width: 42px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: rgba(255,255,255,0.15); border-radius: 999px; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  input:checked + .slider { background: #2f9a58; }
  input:checked + .slider:before { transform: translateX(18px); }

  .note { font-size: 11.5px; color: #9fb3a8; margin-top: 16px; line-height: 1.5; }
  .time-input {
    margin-top: 4px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; color: #eaf3ec; font-size: 12px; padding: 4px 6px; font-family: 'Manrope', sans-serif;
  }
</style>
</head>
<body>
<div class="wrap">
  <a href="akun.html" class="back-link">← Kembali</a>
  <h1 class="serif">Notifikasi</h1>
  <p class="desc">Atur pengingat otomatis untuk waktu sholat.</p>

  <div class="perm-box">
    <span id="permStatus">Memeriksa izin...</span>
    <div class="perm-actions">
      <button class="perm-btn" onclick="requestPermission()">Izinkan</button>
      <button class="perm-btn" onclick="deteksiLokasi()">📍 Deteksi</button>
    </div>
  </div>

  <div id="jadwalList"></div>
  <div id="jadwalInfo" style="font-size:12px; color:#9fb3a8; margin-top:6px;"></div>

  <div style="margin-top:20px;">
    <!-- Subuh -->
    <div class="toggle-row">
      <div class="label">
        <span class="name">Subuh</span>
        <input type="time" id="time_subuh" class="time-input" onchange="updateManualTime('subuh')">
      </div>
      <label class="switch"><input type="checkbox" id="toggle_subuh" onchange="toggleAlarm('subuh')"><span class="slider"></span></label>
    </div>

    <!-- Dzuhur -->
    <div class="toggle-row">
      <div class="label">
        <span class="name">Dzuhur</span>
        <input type="time" id="time_dzuhur" class="time-input" onchange="updateManualTime('dzuhur')">
      </div>
      <label class="switch"><input type="checkbox" id="toggle_dzuhur" onchange="toggleAlarm('dzuhur')"><span class="slider"></span></label>
    </div>

    <!-- Ashar -->
    <div class="toggle-row">
      <div class="label">
        <span class="name">Ashar</span>
        <input type="time" id="time_ashar" class="time-input" onchange="updateManualTime('ashar')">
      </div>
      <label class="switch"><input type="checkbox" id="toggle_ashar" onchange="toggleAlarm('ashar')"><span class="slider"></span></label>
    </div>

    <!-- Maghrib -->
    <div class="toggle-row">
      <div class="label">
        <span class="name">Maghrib</span>
        <input type="time" id="time_maghrib" class="time-input" onchange="updateManualTime('maghrib')">
      </div>
      <label class="switch"><input type="checkbox" id="toggle_maghrib" onchange="toggleAlarm('maghrib')"><span class="slider"></span></label>
    </div>

    <!-- Isya -->
    <div class="toggle-row">
      <div class="label">
        <span class="name">Isya</span>
        <input type="time" id="time_isya" class="time-input" onchange="updateManualTime('isya')">
      </div>
      <label class="switch"><input type="checkbox" id="toggle_isya" onchange="toggleAlarm('isya')"><span class="slider"></span></label>
    </div>
  </div>

  <p class="note">Catatan: notifikasi hanya akan muncul selama tab browser ini tetap terbuka.</p>
</div>
<script src="js/api.js"></script>
<script src="js/notifikasi.js"></script>
</body>
</html>
