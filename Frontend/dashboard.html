<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Tanaman Digital</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Main Layout */
    .dash-wrap {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }
    .dash-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 24px; 
    }
    .stat-row { 
      display: flex; 
      gap: 12px; 
      margin: 20px 0; 
    }
    .stat-box { 
      flex: 1; 
      background: #f3f7f4; 
      border-radius: 12px; 
      padding: 14px; 
      text-align: center; 
    }
    .stat-box b { 
      display: block; 
      font-size: 20px; 
      font-family: 'Lora', serif; 
      color: #1a3320; 
    }
    .stat-box span { 
      font-size: 11px; 
      color: #6b7d70; 
    }
    .logout-btn { 
      background: none; 
      border: none; 
      color: #b3261e; 
      font-size: 13px; 
      cursor: pointer; 
    }

    /* Misi Items */
    .misi-section {
      max-width: 480px;
      margin: 0 auto;
    }
    .misi-item {
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding: 12px 14px; 
      border-radius: 12px; 
      margin-bottom: 8px;
      border-left: 4px solid #d8e0dc;
    }
    .misi-item.abu { background: #f3f4f3; border-left-color: #9fb3a8; }
    .misi-item.hijau { background: #eaf6ee; border-left-color: #2f9a58; }
    .misi-item.merah { background: #fdecec; border-left-color: #b3261e; }
    .misi-name { font-weight: 700; font-size: 14px; }
    .misi-time { font-size: 11px; color: #6b7d70; }
    .misi-actions button {
      border: none; 
      border-radius: 8px; 
      padding: 6px 14px; 
      font-size: 12px; 
      font-weight: 700; 
      cursor: pointer; 
      margin-left: 6px;
    }
    .btn-ya { background: #2f9a58; color: #fff; }
    .btn-tidak { background: #e5e5e5; color: #444; }
    .misi-actions button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Modal Overlay & Box */
    .modal-overlay {
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0, 0, 0, 0.5);
      align-items: center; 
      justify-content: center; 
      z-index: 1000;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-box {
      background: #fff; 
      padding: 24px; 
      border-radius: 16px; 
      max-width: 320px; 
      width: 90%; 
      text-align: center;
    }
    .modal-box h3 { 
      font-family: 'Lora', serif; 
      margin-bottom: 12px; 
    }
    .modal-sub { 
      font-size: 13px; 
      color: #6b7d70; 
      margin-bottom: 16px; 
    }
    .alasan-options { 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      margin-bottom: 16px; 
    }
    .alasan-btn {
      padding: 10px 12px; 
      border: 1px solid #d8e0dc; 
      border-radius: 10px;  
      background: #fafcfb;
      font-family: 'Manrope', sans-serif; 
      font-size: 13px; 
      color: #1a3320;
      cursor: pointer; 
      text-align: left;
      transition: all 0.2s ease;
    }
    .alasan-btn:hover { 
      border-color: #2f6b46; 
      background: #eaf6ee;
    }
    .cancel-btn {
      width: 100%; 
      padding: 10px 12px;  
      background: #fff8f6; 
      border: none; 
      border-radius: 8px;
      color: #b3261e; 
      font-size: 13px; 
      font-weight: 600;
      cursor: pointer;
    }

    /* Toast Notification */
    .dalil-toast {
      display: none; 
      position: fixed; 
      bottom: 20px; 
      left: 50%; 
      transform: translateX(-50%);
      background: #1a3320; 
      color: #fff; 
      padding: 14px 20px; 
      border-radius: 12px; 
      max-width: 320px;
      font-size: 13px; 
      z-index: 60; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .dalil-toast.show { display: block; }
  </style>
</head>
<body>

  <div class="dash-wrap">
    <div class="dash-header">
      <div>
        <div style="font-size:12px; color:#6b7d70;">Selamat datang,</div>
        <div style="font-size:20px; font-weight:700;" id="userName">...</div>
      </div>
      <button class="logout-btn" onclick="logout()">Keluar</button>
    </div>

    <h2 class="serif" id="tahapLabel">...</h2>

    <div class="stat-row">
      <div class="stat-box"><b id="poinNutrisi">-</b><span>Poin Nutrisi</span></div>
      <div class="stat-box"><b id="hariBerjalan">-</b><span>Hari Berjalan</span></div>
      <div class="stat-box"><b id="totalPanen">-</b><span>Total Panen</span></div>
    </div>

    <button class="btn-primary" id="harvestBtn" disabled>Memuat...</button>

    <div class="misi-section">
      <h3 class="serif" style="margin: 24px 0 12px;">Misi Hari Ini</h3>
      <div id="misiList"></div>
    </div>
  </div>

  <!-- Modal Alasan Tidak Sholat -->
  <div class="modal-overlay" id="alasanModal">
    <div class="modal-box">
      <h3 class="serif">Kenapa belum sempat?</h3>
      <p class="modal-sub" id="modalMissionName"></p>
      <div class="alasan-options" id="alasanOptions">
        <button class="alasan-btn" data-alasan="sibuk">Sibuk</button>
        <button class="alasan-btn" data-alasan="lupa">Lupa</button>
        <button class="alasan-btn" data-alasan="haid" id="haidBtn" style="display:none;">Haid</button>
      </div>
      <button class="cancel-btn" onclick="closeModal()">Batal</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="dalil-toast" id="dalilToast"></div>

  <!-- JavaScript Scripts -->
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/missions.js"></script>
</body>
</html>
