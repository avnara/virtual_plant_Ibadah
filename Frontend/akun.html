<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — Tanaman Digital</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Manrope', sans-serif; color: #eaf3ec; padding: 24px 16px 80px;
    background: linear-gradient(180deg, #16283b 0%, #0a1220 60%, #0d1a15 100%);
    min-height: 100vh;
  }
  .serif { font-family: 'Lora', serif; }
  .wrap { max-width: 480px; margin: 0 auto; }

  .profile-row { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg,#2f9a58,#1c5c37);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Lora', serif; font-size: 22px; font-weight: 700;
  }
  .profile-name { font-size: 18px; font-weight: 700; }
  .profile-username { font-size: 12.5px; color: #9fb3a8; }
  .level-badge {
    display: inline-block; margin-top: 4px; font-size: 11px; color: #4ade80;
    background: rgba(74,222,128,0.12); padding: 3px 10px; border-radius: 999px;
  }

  .stat-row { display: flex; gap: 10px; margin-bottom: 22px; }
  .stat-card {
    flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px; text-align: center; padding: 14px 4px;
  }
  .stat-card b { font-size: 20px; display: block; font-family: 'Lora', serif; }
  .stat-card span { font-size: 10.5px; color: #9fb3a8; }

  .menu-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
  .menu-item {
    display: flex; align-items: center; gap: 12px; padding: 14px 10px;
    border-radius: 14px; text-decoration: none; color: inherit; cursor: pointer;
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  }
  .menu-item:hover { background: rgba(255,255,255,0.06); }
  .menu-icon {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .menu-title { font-size: 14px; font-weight: 700; }
  .menu-desc { font-size: 11.5px; color: #9fb3a8; }
  .menu-arrow { margin-left: auto; color: #9fb3a8; }

  .logout-btn {
    width: 100%; margin-top: 6px; background: rgba(224,92,92,0.1); border: 1px solid rgba(224,92,92,0.3);
    color: #e05c5c; font-family: 'Manrope', sans-serif; font-weight: 700; font-size: 14px;
    padding: 14px; border-radius: 12px; cursor: pointer;
  }

  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15,33,25,0.97); backdrop-filter: blur(8px);
    display: flex; justify-content: space-around; align-items: center; padding: 10px 6px; z-index: 40;
  }
  .nav-btn { background: none; border: none; color: #9fb3a8; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-family: 'Manrope', sans-serif; font-size: 11px; padding: 6px 14px; border-radius: 10px; }
  .nav-btn.active { color: #4ade80; background: rgba(74,222,128,0.12); }
  .nav-btn svg { width: 20px; height: 20px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="profile-row">
    <div class="avatar" id="avatarLetter">-</div>
    <div>
      <div class="profile-name" id="profileName">...</div>
      <div class="profile-username" id="profileUsername">...</div>
      <div class="level-badge" id="levelBadge">-</div>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-card"><b id="statHariAktif">-</b><span>Hari Aktif</span></div>
    <div class="stat-card"><b id="statPanen">-</b><span>Panen</span></div>
    <div class="stat-card"><b id="statStreak">-</b><span>Streak 🔥</span></div>
  </div>

  <div class="menu-list">
    <a href="profil.html" class="menu-item">
      <div class="menu-icon" style="background:rgba(139,92,246,.15); color:#a78bfa;">👤</div>
      <div><div class="menu-title">Edit Profil</div><div class="menu-desc">Ubah nama & data diri</div></div>
      <span class="menu-arrow">›</span>
    </a>
    <a href="notifikasi.html" class="menu-item">
      <div class="menu-icon" style="background:rgba(245,166,35,.15); color:#f5a623;">🔔</div>
      <div><div class="menu-title">Notifikasi</div><div class="menu-desc">Atur pengingat waktu sholat</div></div>
      <span class="menu-arrow">›</span>
    </a>
    <a href="riwayat.html" class="menu-item">
      <div class="menu-icon" style="background:rgba(74,222,128,.15); color:#4ade80;">📊</div>
      <div><div class="menu-title">Riwayat</div><div class="menu-desc">Pencapaian & riwayat panen</div></div>
      <span class="menu-arrow">›</span>
    </a>
    <a href="kiblat.html" class="menu-item">
      <div class="menu-icon" style="background:rgba(56,189,248,.15); color:#38bdf8;">🧭</div>
      <div><div class="menu-title">Kompas Kiblat</div><div class="menu-desc">Arah kiblat dari lokasimu</div></div>
      <span class="menu-arrow">›</span>
    </a>
  </div>

  <button class="logout-btn" onclick="logout()">⏻ Keluar</button>
</div>

<nav class="bottom-nav">
  <a href="tanaman.html" class="nav-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M12 11v10"/></svg>
    Tanaman
  </a>
  <a href="beranda.html" class="nav-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    Beranda
  </a>
  <a href="statistik.html" class="nav-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
    Data Diagram
  </a>
  <a href="akun.html" class="nav-btn active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    Menu
  </a>
</nav>

<script src="js/api.js"></script>
<script src="js/akun.js"></script>
</body>
</html>
